[project]
name = "passthru"
version = "0.1.0"
description = "Measure what your voice lost on the way to your coding agent."
requires-python = ">=3.10"
license = { text = "MIT" }

dependencies = [
    "mlx-whisper>=0.4",
    "ocrmac>=1.0",
    "numpy>=1.26",
]

[project.scripts]
passthru = "passthru.cli:main"
passthru-scratchpad = "passthru.scratchpad:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/passthru"]

[tool.pytest.ini_options]
testpaths = ["tests"]